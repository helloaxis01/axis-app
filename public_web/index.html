  (function () {
    /** Bump axis_ob when onboarding route changes materially (avoids stale cached document after deploy). */
    window.axisOnboardingHref = function () {
      var OND = "mparjodw";
      try {
        if (window.Capacitor && typeof window.Capacitor.isNativePlatform === "function" && window.Capacitor.isNativePlatform()) {
          return "./onboarding.html?axis_ob=" + OND;
        }
        var path = "./onboarding";
        if (window.location.protocol && window.location.protocol !== "file:") {
          var p = window.location.pathname || "/";
          var d = p.replace(/[^/]*$/, "");
          if (d.slice(-1) !== "/") d += "/";
          path = window.location.origin + d + "onboarding";
        }
        var u = new URL(path, window.location.href);
        u.searchParams.set("axis_ob", OND);
        return u.href;
      } catch (e) {
        return "./onboarding?axis_ob=" + OND;
      }
    };
  })();
  </script>

  <script>
    function showLoadErr(msg) {
      var el = document.getElementById('load-err');
      if (el) { el.style.display = 'block'; el.textContent = msg; }
      try { window.axisDismissBootOverlay(); } catch (e) {}
    }
    window.axisDismissBootOverlay = function () {
      var el = document.getElementById('boot-status');
      if (el) el.remove();
    };
    window.onerror = function(msg, src, line, col, err) {
      var s = String(msg || "");
      // Browsers use the literal "Script error." when the real error is hidden (cross-origin
      // script without CORS, extension-injected code, or iOS/Safari masking). Do not replace the
      // whole UI in that case — it looks like a broken app but the real message is in Web Inspector.
      if ((s === "Script error." || s === "Script error") && (line == null || line === 0)) {
        try {
          console.warn(
            "[AXIS] Opaque script error (line/column hidden by browser). Source:",
            src,
            "— open the console or disable extensions; check localStorage axis_errors if capture ran."
          );
        } catch (e) {}
        return false;
      }
      showLoadErr("Error: " + msg + (err && err.stack ? "\n" + err.stack : ""));
      return true;
    };
    window.addEventListener("unhandledrejection", function (ev) {
      try {
        var reason = ev && ev.reason;
        var msg = reason && reason.message ? reason.message : String(reason || "Unhandled promise rejection");
        showLoadErr("Error: " + msg + (reason && reason.stack ? "\n" + reason.stack : ""));
      } catch (e) {}
    });
    setTimeout(function () {
      try {
        var root = document.getElementById("root");
        if (!root || root.children.length > 0) return;
        showLoadErr("AXIS did not start. Delete the app and reinstall from Xcode, or check Safari Web Inspector for errors.");
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen && typeof window.Capacitor.Plugins.SplashScreen.hide === "function") {
          window.Capacitor.Plugins.SplashScreen.hide().catch(function () {});
        }
      } catch (e) {}
    }, 4000);
  </script>
