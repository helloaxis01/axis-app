.ob-pad { padding: 0 24px; max-width: 560px; margin: 0 auto; }

/* Button/icon reset ONLY for the main app shell so onboarding keeps themed controls */
.app button, .app button * { color: var(--axis-black) !important; }
.app button svg { fill: var(--axis-black) !important; stroke: var(--axis-black) !important; }

  /* Mood button labels use inline colors; do not force button color (breaks icon accent) */
  .ob-wrap {
    width: 100%; position: relative; box-sizing: border-box;
    background: var(--ob-page-bg); font-family: var(--font-ui), sans-serif; font-weight: 500;
    transition: color 0.45s ease, background 0.45s ease;
  }
  /* Footer: dots pinned to exact horizontal center of bar — independent of < > widths (no grid reflow) */
  .ob-footer-row {
    position: relative;
    width: 100%;
    min-height: 52px;
    box-sizing: border-box;
  }
  .ob-footer-side {
    position: absolute;
    top: 50%;
    transform: translate3d(0, -50%, 0);
    display: flex;
    align-items: center;
    z-index: 2;
    pointer-events: none;
    backface-visibility: hidden;
  }
  .ob-footer-side--left {
    left: 0;
    justify-content: flex-start;
  }
  .ob-footer-side--right {
    right: 0;
